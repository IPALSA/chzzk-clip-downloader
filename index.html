<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>치지직 클립 다운로더</title>
<style>
:root{--bg:#f6f7f5;--fg:#16191a;--mute:#6b7473;--card:#fff;--line:#dfe3e1;--accent:#00d68a;--accent-fg:#04251a;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#101312;--fg:#eef2f0;--mute:#8f9a97;--card:#181c1b;--line:#2a302e;--accent:#00e595;--accent-fg:#04251a;--err:#ff7a6b}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));min-height:100vh}
main{max-width:520px;margin:8vh auto 0}
h1{font-size:1.6rem;letter-spacing:-.02em;margin:0 0 6px}
p.sub{color:var(--mute);margin:0 0 22px;line-height:1.5}
.row{display:flex;gap:8px}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;min-width:0}
input{flex:1}
input:focus-visible,select:focus-visible,button:focus-visible,a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,a.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:13px 18px;cursor:pointer;text-decoration:none;text-align:center}
button:disabled{opacity:.5;cursor:wait}
#msg{min-height:1.4em;margin:12px 2px;font-size:.92rem;color:var(--mute)}
#msg.err{color:var(--err)}
#result{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
#result img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line)}
.body{padding:14px;display:grid;gap:12px}
.title{font-weight:700;line-height:1.35;word-break:break-word}
.meta{color:var(--mute);font-size:.88rem}
.body .row select{flex:1}
footer{color:var(--mute);font-size:.8rem;line-height:1.5;margin-top:28px}
</style>
</head>
<body>
<main>
  <h1>치지직 클립 다운로더</h1>
  <p class="sub">클립 주소를 붙여넣으면 MP4로 저장할 수 있어요.</p>
  <div class="row">
    <input id="url" type="url" inputmode="url" placeholder="https://chzzk.naver.com/clips/…" autocomplete="off">
    <button id="go">불러오기</button>
  </div>
  <div id="msg" role="status"></div>
  <section id="result">
    <img id="thumb" alt="클립 썸네일">
    <div class="body">
      <div><div class="title" id="title"></div><div class="meta" id="meta"></div></div>
      <div class="row">
        <select id="q" aria-label="화질"></select>
        <a class="btn" id="dl" href="#">다운로드</a>
      </div>
    </div>
  </section>
  <footer>개인 보관용으로만 사용하세요. 클립의 저작권은 스트리머와 플랫폼에 있어요.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
let info = null;
const fmt = s => s ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : '';

function say(t, err){ $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }
function link(){
  const u = $('q').value;
  $('dl').href = `/api/download?u=${encodeURIComponent(u)}&name=${encodeURIComponent(info.title)}`;
}

async function load(){
  const url = $('url').value.trim();
  $('result').style.display = 'none';
  if(!url){ say('클립 주소를 입력해 주세요.', true); return; }
  $('go').disabled = true; say('불러오는 중…');
  try{
    const r = await fetch('/api/info?url=' + encodeURIComponent(url));
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || '알 수 없는 오류');
    info = d;
    $('thumb').src = d.thumbnail || '';
    $('title').textContent = d.title;
    $('meta').textContent = fmt(d.duration);
    $('q').innerHTML = d.qualities.map(q => `<option value="${q.url.replace(/"/g,'&quot;')}">${q.label}</option>`).join('');
    link(); say('');
    $('result').style.display = 'block';
  }catch(e){ say(e.message, true); }
  $('go').disabled = false;
}
$('go').onclick = load;
$('url').addEventListener('keydown', e => { if(e.key === 'Enter') load(); });
$('q').onchange = link;
</script>
</body>
</html>
